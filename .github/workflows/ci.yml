name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint:eslint
      - run: npm run typecheck

  unit-and-integration-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # One aggregate coverage execution. The global thresholds in
      # vitest.config.ts are enforced exactly once against the complete
      # coverage map; segmented coverage shards are intentionally not used
      # because each shard would enforce the global threshold against only a
      # partial subset and later shards would overwrite coverage/.
      - run: npm run test:coverage
      - name: Upload Coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  script-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # Dedicated script coverage job. scripts/ are excluded from the aggregate
      # coverage map unless COVERAGE_SCRIPTS=true; this job enforces the
      # scripts/ thresholds from vitest.config.ts independently.
      - run: npm run test:coverage:scripts
      - name: Upload Script Coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: script-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run verify:contracts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=critical

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-and-integration-tests, coverage, script-coverage, contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:dist
      - name: Upload Dist Output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: dist-artifacts
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

  # Windows-sensitive-tests: targets the path-handling and Electron-specific
  # filesystem regressions the recent Windows path bug exposed. The main
  # Ubuntu job covers the full suite, but Windows path separators and
  # process.platform branches (`win32`) only exercise correctly on a
  # real Windows runner. We pin a minimal Windows subset here:
  #   - typecheck
  #   - the Electron main-process services tests
  #   - the verify-safety-guard + verify-markdown-links gates
  # We do NOT mark these as continue-on-error: failures block the PR.
  windows-sensitive-tests:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Typecheck (renderer + electron)
        run: npm run typecheck
      - name: Run Electron main-process tests on Windows
        run: npm run test:electron
      - name: Run Windows-sensitive bridge and storage tests
        run: npx vitest run src/services/desktopBridge.test.ts tests/storage --fileParallelism=false
      - name: Verify safety guard
        run: npm run verify:safety-guard
      - name: Verify markdown links
        run: npm run verify:markdown-links
      - name: Verify repository identity
        run: npm run verify:repository-identity
      - name: Audit dependencies (release gate)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit complete dependency graph for critical advisories
        run: npm audit --audit-level=critical
      - name: Build
        run: npm run build
      - name: Verify build output
        run: npm run verify:dist

  # macOS-sensitive-tests: exercises macOS-specific filesystem, safeStorage,
  # and Electron main-process assumptions that do not surface on Ubuntu or
  # Windows runners. Mirrors the Windows-sensitive subset for consistency.
  macos-sensitive-tests:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Typecheck (renderer + electron)
        run: npm run typecheck
      - name: Run Electron main-process tests on macOS
        run: npm run test:electron
      - name: Run macOS-sensitive bridge and storage tests
        run: npx vitest run src/services/desktopBridge.test.ts tests/storage --fileParallelism=false
      - name: Verify safety guard
        run: npm run verify:safety-guard
      - name: Verify markdown links
        run: npm run verify:markdown-links
      - name: Verify repository identity
        run: npm run verify:repository-identity
      - name: Audit dependencies (release gate)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit complete dependency graph for critical advisories
        run: npm audit --audit-level=critical
      - name: Build
        run: npm run build
      - name: Verify build output
        run: npm run verify:dist

  # Packaged Electron smoke test: launches the real built .app on macOS to
  # catch packaging / runtime bootstrap regressions that unit tests cannot.
  # This depends on the Ubuntu build-and-test job to avoid burning runner
  # minutes when the core suite is already broken.
  electron-smoke-macos:
    runs-on: macos-14
    timeout-minutes: 45
    needs: [build, macos-sensitive-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Package macOS app
        run: npm run dist:mac:arm64
      - name: Run packaged Electron smoke test
        run: npx vitest run tests/smoke/
        env:
          RUN_ELECTRON_SMOKE: 'true'
      - name: Remove packaging staging directories
        run: node scripts/clean-release-staging.cjs
      - name: Verify macOS artifact
        run: node scripts/verify-dist.cjs --mac --arch arm64
      - name: Capture sanitized smoke diagnostics on failure
        if: failure()
        run: node scripts/capture-smoke-diagnostics.cjs --platform darwin --arch arm64 --output smoke-diagnostics/summary.json
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-smoke-macos-diagnostics-${{ github.sha }}
          path: smoke-diagnostics/
          if-no-files-found: ignore
          # Sanitized summary only. No secrets, prompts, raw generated media, or
          # unredacted userData are written to this directory.

  # Packaged Electron smoke test on Windows
  electron-smoke-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    needs: [build, windows-sensitive-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Package Windows portable app
        run: npm run dist:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Run packaged Electron smoke test
        run: npx vitest run tests/smoke/
        env:
          RUN_ELECTRON_SMOKE: 'true'
      - name: Remove packaging staging directories
        run: node scripts/clean-release-staging.cjs
      - name: Verify Windows portable artifact
        run: npm run verify:dist:portable
      - name: Capture sanitized smoke diagnostics on failure
        if: failure()
        run: node scripts/capture-smoke-diagnostics.cjs --platform win32 --arch x64 --output smoke-diagnostics/summary.json
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-smoke-windows-diagnostics-${{ github.sha }}
          path: smoke-diagnostics/
          if-no-files-found: ignore
          # Sanitized summary only. No secrets, prompts, raw generated media, or
          # unredacted userData are written to this directory.

  # Packaged Electron smoke test on Linux
  electron-smoke-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm-dev rpm
      - name: Package Linux app
        # electron-builder downloads AppImage tooling (appimage-*.7z, 7zip)
        # from an upstream endpoint that intermittently returns 504. Retrying
        # the canonical packaging script is safe because dist:linux starts
        # with `npm run clean`, which wipes partial release/ output.
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Linux packaging attempt ${attempt}/3"
            if npm run dist:linux; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Linux packaging failed on final attempt"
              exit 1
            fi
            echo "Linux packaging failed; retrying in 30s..."
            sleep 30
          done
      - name: Run packaged Electron smoke test
        run: xvfb-run --auto-servernum npx vitest run tests/smoke/
        env:
          RUN_ELECTRON_SMOKE: 'true'
      - name: Remove packaging staging directories
        run: node scripts/clean-release-staging.cjs
      - name: Verify Linux artifact
        run: node scripts/verify-dist.cjs --linux
      - name: Capture sanitized smoke diagnostics on failure
        if: failure()
        run: node scripts/capture-smoke-diagnostics.cjs --platform linux --arch x64 --output smoke-diagnostics/summary.json
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-smoke-linux-diagnostics-${{ github.sha }}
          path: smoke-diagnostics/
          if-no-files-found: ignore
          # Sanitized summary only. No secrets, prompts, raw generated media, or
          # unredacted userData are written to this directory.
